<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>EduConnect GH - Academic Process & Management Portal</title>
    <meta
      name="description"
      content="Track academic processes, course materials, fee status and announcements for Ghanaian tertiary education, all in one portal."
    />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F172E" />

    <!-- Standard favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- iOS Safari PWA support -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EduConnect GH" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Fonts: Sora for display headings, Inter for body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="EduConnect GH - Academic Process & Management Portal" />
    <meta
      property="og:description"
      content="One portal for academic processes, course materials, fees and announcements across Ghanaian tertiary institutions."
    />
    <meta property="og:type" content="website" />
  </head>
  <body class="bg-navy-50 font-sans antialiased">
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui;">
        EduConnect GH requires JavaScript to run. Please enable JavaScript in your browser.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
